name = "stato-servizi"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Due gruppi di servizi: il piano gratuito consente 50 richieste esterne per esecuzione.
[triggers]
crons = ["0-59/5 * * * *", "2-59/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "stato-servizi"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
BASE_URL = "https://stato.chainweb.solutions"
