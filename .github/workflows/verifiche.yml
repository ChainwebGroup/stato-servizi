name: verifiche
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      azzera:
        description: 'Ricomincia lo storico da zero'
        default: 'no'
concurrency:
  group: verifiche
  cancel-in-progress: false
jobs:
  verifica-e-pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verifiche e pagine
        run: node gen/genera.mjs out
        env:
          SITO: https://stato-servizi.pages.dev
          BASE_URL: https://stato-servizi.pages.dev
          STORICO_VUOTO: ${{ github.event.inputs.azzera == 'si' && '1' || '0' }}
      - name: Pubblica su Cloudflare Pages
        run: npx -y wrangler@3 pages deploy out --project-name stato-servizi --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
